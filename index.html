<!DOCTYPE html>
<html lang="bg"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3A5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Дневен успех</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
body{font-family:Manrope,system-ui,sans-serif;background:#EEF2F6;color:#16283F;padding:env(safe-area-inset-top) 0 0;margin:0;min-height:100dvh;overflow-x:hidden;-webkit-text-size-adjust:100%}
html{overflow-x:hidden}
input,select,textarea{font-size:max(16px,1em)!important}
button{touch-action:manipulation}
.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
:focus-visible{outline:3px solid #3B6FD8;outline-offset:2px}
</style></head>
<body><div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const MONTHS=['Януари','Февруари','Март','Април','Май','Юни','Юли','Август','Септември','Октомври','Ноември','Декември'];
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Нд'];
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
// Фиксирана скала от 11 стъпки: индекс 0 = 0%, 1 = 10% ... 10 = 100%
const SCALE=['#cfcfcf','#ab0000','#ff5757','#ff8000','#ffb300','#fff178','#c289fa','#6fd1fc','#325ff0','#6bed9a','#15803d'];
const dark=c=>{const[r,g,b]=hex(c);return (r*299+g*587+b*114)/1000<150};
const ICON={cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',chart:'<path d="M3 3v18h18M18 17V9M13 17V5M8 17v-3"/>',
grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
plus:'<path d="M5 12h14M12 5v14"/>',trash:'<path d="M3 6h18M19 6l-1 14H6L5 6M10 11v6M14 11v6M9 6V4h6v2"/>',
check:'<path d="M20 6 9 17l-5-5"/>',x:'<path d="M18 6 6 18M6 6l12 12"/>',l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>'};
const I=({n,s=20})=><svg width={s} height={s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:ICON[n]}}/>;

const DEF_TASKS=[{id:'a',name:'Спорт',w:30},{id:'b',name:'Четене',w:20},{id:'c',name:'Работа по проект',w:50}];
const DEF={tpls:[{id:'t1',name:'Шаблон 1',tasks:DEF_TASKS}],def:'t1',days:{},done:{},notes:{},pal:'green'};
const load=()=>{try{
 const raw=JSON.parse(localStorage.getItem('dst')||'{}'),s={...DEF,...raw};
 if(!raw.tpls){ // миграция от старата версия: общите задачи стават „Шаблон 1“, а вече отбелязаните дни запазват своите задачи
  const old=raw.tasks||DEF_TASKS;s.tpls=[{id:'t1',name:'Шаблон 1',tasks:old}];s.def='t1';s.days={};
  Object.keys(s.done||{}).forEach(k=>{s.days[k]={tasks:old.map(t=>({...t})),tpl:'t1'}});}
 delete s.tasks;return s;
}catch(e){return DEF}};

const sel=e=>{const el=e.target;setTimeout(()=>el.select(),0)};
// Поле за тежест: селектира се при фокус, може да се изтрие докрай, а числото се записва, щом е валидно (1–100)
function WInput({value,onCommit,className}){
 const [t,setT]=useState(String(value));
 useEffect(()=>{setT(String(value))},[value]);
 return <input type="text" inputMode="numeric" pattern="[0-9]*" value={t} className={className} aria-label="Тежест" onFocus={sel}
  onChange={e=>{const v=e.target.value.replace(/\D/g,'').slice(0,3);setT(v);const n=parseInt(v,10);if(n>=1)onCommit(Math.min(100,n))}}
  onBlur={()=>{const n=parseInt(t,10);setT(n>=1?String(Math.min(100,n)):String(value))}}/>}

function App(){
 const [S,setS]=useState(load);
 const [tab,setTab]=useState('cal');
 const [sheet,setSheet]=useState(null);
 const now=new Date(),today=key(now);
 const [cur,setCur]=useState({y:now.getFullYear(),m:now.getMonth()});
 const [year,setYear]=useState(false);
 const [nn,setNn]=useState(''),[nw,setNw]=useState(10),[dn,setDn]=useState(''),[dw,setDw]=useState(10),[edit,setEdit]=useState(false),[selTpl,setSelTpl]=useState(null);
 useEffect(()=>{try{localStorage.setItem('dst',JSON.stringify(S))}catch(e){}},[S]);
 useEffect(()=>{if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{})},[]);
 // Днешният и бъдещите дни следват шаблона си, освен ако не са редактирани ръчно; минали дни остават непроменени
 const sync=s=>{let ch=false;const days={...s.days};Object.keys(days).forEach(k=>{const d=days[k];if(k<today||d.custom)return;const t=s.tpls.find(x=>x.id===d.tpl);if(t&&JSON.stringify(t.tasks)!==JSON.stringify(d.tasks)){days[k]={...d,tasks:t.tasks.map(x=>({...x}))};ch=true}});return ch?{...s,days}:s};
 useEffect(()=>{setS(sync)},[S.tpls]);
 const R=SCALE;
 const tplOf=id=>S.tpls.find(t=>t.id===id)||S.tpls[0];
 const dayTasks=k=>(S.days[k]&&S.days[k].tasks)||tplOf(S.def).tasks;
 const pct=k=>{const T=dayTasks(k),total=T.reduce((a,t)=>a+t.w,0);if(!total)return 0;const d=S.done[k]||[];return Math.round(T.filter(t=>d.includes(t.id)).reduce((a,t)=>a+t.w,0)/total*1000)/10};
 const col=k=>R[Math.min(10,Math.round(pct(k)/10))]; // закръгляне към най-близката десетка (56% → 60%)
 const mat=(s,k)=>s.days[k]?s:{...s,days:{...s.days,[k]:{tasks:tplOf(s.def).tasks.map(t=>({...t})),tpl:tplOf(s.def).id}}};
 const toggle=(k,id)=>setS(s=>{s=mat(s,k);const d=s.done[k]||[];return {...s,done:{...s.done,[k]:d.includes(id)?d.filter(x=>x!==id):[...d,id]}}});
 const updDay=(k,fn)=>setS(s=>{s=mat(s,k);return {...s,days:{...s.days,[k]:{...s.days[k],tasks:fn(s.days[k].tasks),custom:true}}}});
 const applyTpl=(k,id)=>{const t=tplOf(id),ids=t.tasks.map(x=>x.id);if((S.done[k]||[]).some(i=>!ids.includes(i))&&!confirm('Отметките за задачи, които ги няма в този шаблон, ще се изгубят. Продължаваш ли?'))return;setS(s=>({...s,days:{...s.days,[k]:{tasks:t.tasks.map(x=>({...x})),tpl:id}},done:{...s.done,[k]:(s.done[k]||[]).filter(i=>ids.includes(i))}}))};
 const open=k=>{setEdit(false);setSheet(k)};
 const note=(k,v)=>setS(s=>({...s,notes:{...s.notes,[k]:v}}));
 const Cell=({k,label,sz='aspect-square',fs='text-xs'})=>{const fut=k>today,c=col(k),p=pct(k);
  return <button onClick={()=>open(k)} aria-label={k+' '+p+'%'} className={`${sz} rounded-lg font-semibold ${fs} flex items-center justify-center ${k===today?'ring-2 ring-offset-1 ring-[#1F3A5F]':''} ${fut?'opacity-40':''}`}
   style={{background:c,color:dark(c)?'#fff':'#16283F'}}>{label}</button>};
 const mdays=(y,m)=>{const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  return [...Array(first).fill(null),...Array.from({length:n},(_,i)=>key(new Date(y,m,i+1)))]};
 const Legend=()=><div className="flex items-center gap-1 mt-3"><span className="text-[11px] mr-1">0%</span>{R.map((c,i)=><span key={i} className="h-4 flex-1 rounded-sm" style={{background:c}}/>)}<span className="text-[11px] ml-1">100%</span></div>;
 const shift=d=>setCur(c=>{const t=new Date(c.y,c.m+d,1);return {y:t.getFullYear(),m:t.getMonth()}});

 const Calendar=()=>{
  return <div>
   <div className="flex flex-wrap items-center justify-between gap-2 mb-3">
    <div className="flex items-center gap-1">
     <button className="p-2" onClick={()=>year?setCur({...cur,y:cur.y-1}):shift(-1)} aria-label="Назад"><I n="l"/></button>
     <h2 className="text-lg font-extrabold min-w-[9.5rem] text-center">{year?cur.y:MONTHS[cur.m]+' '+cur.y}</h2>
     <button className="p-2" onClick={()=>year?setCur({...cur,y:cur.y+1}):shift(1)} aria-label="Напред"><I n="r"/></button>
    </div>
    <div className="flex rounded-lg bg-white p-0.5 text-sm font-semibold">
     {[['Месец',false],['Година',true]].map(([l,v])=><button key={l} onClick={()=>setYear(v)} className={`px-3 py-1 rounded-md ${year===v?'bg-[#1F3A5F] text-white':''}`}>{l}</button>)}
    </div></div>
   {!year?<div className="bg-white rounded-2xl p-3">
     <div className="grid grid-cols-7 gap-1.5 mb-1.5 text-center text-xs text-slate-500">{WD.map(w=><div key={w}>{w}</div>)}</div>
     <div className="grid grid-cols-7 gap-1.5">{mdays(cur.y,cur.m).map((k,i)=>k?<Cell key={k} k={k} label={+k.slice(8)} sz="h-11"/>:<div key={i}/>)}</div>
    </div>
   :<div className="grid grid-cols-3 gap-2">{MONTHS.map((n,m)=><button key={m} onClick={()=>{setCur({...cur,m});setYear(false)}} className="bg-white rounded-xl p-2 text-left">
     <div className="text-xs font-bold mb-1">{n.slice(0,3)}</div>
     <div className="grid grid-cols-7 gap-[2px]">{mdays(cur.y,m).map((k,i)=>k?<span key={k} className={`aspect-square rounded-[2px] ${k>today?'opacity-40':''}`} style={{background:col(k)}}/>:<span key={i}/>)}</div></button>)}</div>}
   <Legend/>
  </div>};

 const Tpls=()=>{
  const tp=S.tpls.find(t=>t.id===selTpl)||tplOf(S.def),tt=tp.tasks.reduce((a,t)=>a+t.w,0);
  const updT=f=>setS(s=>({...s,tpls:s.tpls.map(t=>t.id===tp.id?f(t):t)}));
  const upd=(id,f)=>updT(t=>({...t,tasks:t.tasks.map(x=>x.id===id?{...x,...f}:x)}));
  const add=()=>{if(!nn.trim())return;updT(t=>({...t,tasks:[...t.tasks,{id:Date.now().toString(36),name:nn.trim(),w:Math.min(100,Math.max(1,+nw||1))}]}));setNn('')};
  const newT=copy=>{const n=prompt('Име на шаблона:',copy?tp.name+' (копие)':'Нов шаблон');if(!n||!n.trim())return;const id='t'+Date.now().toString(36);setS(s=>({...s,tpls:[...s.tpls,{id,name:n.trim(),tasks:copy?tp.tasks.map(x=>({...x})):[]}]}));setSelTpl(id)};
  const del=()=>{if(S.tpls.length<2||!confirm('Изтриване на шаблон „'+tp.name+'“? Вече отбелязаните дни не се променят.'))return;const rest=S.tpls.filter(t=>t.id!==tp.id);setS(s=>({...s,tpls:rest,def:s.def===tp.id?rest[0].id:s.def}));setSelTpl(rest[0].id)};
  return <div>
   <h2 className="text-lg font-extrabold mb-1">Шаблони</h2>
   <p className="text-sm text-slate-600 mb-3">Шаблонът със ★ се зарежда автоматично за всеки ден. Промените в шаблон не засягат дни, в които вече има отметки.</p>
   <div className="flex flex-wrap gap-2 mb-3">{S.tpls.map(t=><button key={t.id} onClick={()=>setSelTpl(t.id)} className={`px-3 py-1.5 rounded-full text-sm font-semibold ${t.id===tp.id?'bg-[#1F3A5F] text-white':'bg-white'}`}>{t.id===S.def?'★ ':''}{t.name}</button>)}
    <button onClick={()=>newT(false)} className="px-3 py-1.5 rounded-full text-sm font-semibold bg-white">+ Нов</button></div>
   <input value={tp.name} onChange={e=>updT(t=>({...t,name:e.target.value}))} className="w-full px-3 py-2 rounded-lg bg-white font-bold mb-2" aria-label="Име на шаблона"/>
   <p className={`text-sm mb-3 ${tt===100?'text-emerald-700':'text-amber-700'}`}>Сума на тежестите: {tt}%{tt!==100&&' — за точен резултат направи сумата 100%; иначе процентът се нормализира.'}</p>
   <div className="space-y-2">{tp.tasks.map(t=><div key={t.id} className="bg-white rounded-xl p-2 flex items-center gap-2">
     <input value={t.name} onChange={e=>upd(t.id,{name:e.target.value})} className="flex-1 min-w-0 px-2 py-2 rounded-lg bg-slate-100" aria-label="Име"/>
     <WInput value={t.w} onCommit={w=>upd(t.id,{w})} className="w-16 px-2 py-2 rounded-lg bg-slate-100 text-center"/><span className="text-sm">%</span>
     <button className="p-2 text-red-600" aria-label="Изтрий" onClick={()=>confirm('Изтриване на „'+t.name+'“?')&&updT(x=>({...x,tasks:x.tasks.filter(y=>y.id!==t.id)}))}><I n="trash"/></button></div>)}</div>
   <div className="bg-white rounded-xl p-2 flex items-center gap-2 mt-3">
    <input value={nn} onChange={e=>setNn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&add()} placeholder="Нова задача" className="flex-1 min-w-0 px-2 py-2 rounded-lg bg-slate-100"/>
    <input type="number" onFocus={sel} value={nw} onChange={e=>setNw(e.target.value)} className="w-16 px-2 py-2 rounded-lg bg-slate-100 text-center" aria-label="Тежест"/><span className="text-sm">%</span>
    <button onClick={add} className="p-2 rounded-lg bg-[#1F3A5F] text-white" aria-label="Добави"><I n="plus"/></button></div>
   <div className="flex flex-wrap gap-2 mt-4 text-sm font-semibold">
    <button disabled={tp.id===S.def} onClick={()=>setS(s=>({...s,def:tp.id}))} className="px-3 py-2 rounded-lg bg-[#1F3A5F] text-white disabled:opacity-40">{tp.id===S.def?'По подразбиране ★':'Направи по подразбиране'}</button>
    <button onClick={()=>newT(true)} className="px-3 py-2 rounded-lg bg-white">Дублирай</button>
    <button disabled={S.tpls.length<2} onClick={del} className="px-3 py-2 rounded-lg bg-white text-red-600 disabled:opacity-40">Изтрий</button></div>
  </div>};

 const Stats=()=>{
  const days=n=>Array.from({length:n},(_,i)=>key(new Date(now.getFullYear(),now.getMonth(),now.getDate()-(n-1-i))));
  const avg=a=>a.length?Math.round(a.reduce((x,k)=>x+pct(k),0)/a.length*10)/10:0;
  const wk=days(7),mo=days(now.getDate()).map((_,i)=>key(new Date(now.getFullYear(),now.getMonth(),i+1)));
  const by=Array.from({length:7},()=>[]);days(90).forEach(k=>{const d=new Date(k+'T00:00:00');by[(d.getDay()+6)%7].push(k)});
  const wa=by.map(avg),best=wa.indexOf(Math.max(...wa));
  const Box=({t,v})=><div className="bg-white rounded-xl p-3 flex-1"><div className="text-xs text-slate-500">{t}</div><div className="text-2xl font-extrabold">{v}%</div></div>;
  return <div className="space-y-3">
   <h2 className="text-lg font-extrabold">Статистики</h2>
   <div className="flex gap-2"><Box t="Последните 7 дни" v={avg(wk)}/><Box t="Този месец" v={avg(mo)}/></div>
   <div className="bg-white rounded-xl p-3"><div className="text-sm font-bold mb-2">Последните 14 дни</div>
    <div className="flex items-end gap-1 h-28">{days(14).map(k=><div key={k} className="flex-1 flex flex-col justify-end h-full" title={k}><div className="rounded-t" style={{height:Math.max(pct(k),2)+'%',background:col(k)}}/></div>)}</div></div>
   <div className="bg-white rounded-xl p-3"><div className="text-sm font-bold mb-2">Средно по дни от седмицата (90 дни)</div>
    <div className="flex items-end gap-2 h-28">{wa.map((v,i)=><div key={i} className="flex-1 flex flex-col justify-end items-center h-full"><span className="text-[10px]">{Math.round(v)}</span><div className={`w-full rounded-t ${i===best?'bg-[#1F3A5F]':'bg-slate-300'}`} style={{height:Math.max(v,2)+'%'}}/><span className="text-xs mt-1">{WD[i]}</span></div>)}</div>
    <p className="text-sm mt-2">Най-продуктивен ден: <b>{WD[best]}</b> ({Math.round(wa[best])}%)</p></div>
  </div>};

 const Sheet=()=>{
  const k=sheet,p=pct(k),d=S.done[k]||[],dt=new Date(k+'T00:00:00'),T=dayTasks(k),tot=T.reduce((a,t)=>a+t.w,0),cur=S.days[k]?S.days[k].tpl:S.def;
  const close=()=>{setSheet(null);setEdit(false)};
  const addD=()=>{if(!dn.trim())return;updDay(k,a=>[...a,{id:Date.now().toString(36),name:dn.trim(),w:Math.min(100,Math.max(1,+dw||1))}]);setDn('')};
  const saveT=()=>{const n=prompt('Име на новия шаблон:');if(!n||!n.trim())return;setS(s=>({...s,tpls:[...s.tpls,{id:'t'+Date.now().toString(36),name:n.trim(),tasks:T.map(x=>({...x}))}]}))};
  const chg=(id,f)=>updDay(k,a=>a.map(x=>x.id===id?{...x,...f}:x));
  return <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-black/40" onClick={close}>
   <div className="sheet bg-white w-full max-w-md rounded-t-3xl sm:rounded-3xl p-4 max-h-[90dvh] overflow-y-auto" style={{paddingBottom:'calc(1rem + env(safe-area-inset-bottom))'}} onClick={e=>e.stopPropagation()}>
    <div className="flex items-center justify-between mb-2"><div><div className="font-extrabold">{dt.getDate()} {MONTHS[dt.getMonth()]} {dt.getFullYear()}</div><div className="text-xs text-slate-500">{WD[(dt.getDay()+6)%7]}</div></div>
     <div className="flex items-center gap-3"><span className="px-3 py-1 rounded-full font-extrabold" style={{background:col(k),color:dark(col(k))?'#fff':'#16283F'}}>{p}%</span><button onClick={close} className="p-2" aria-label="Затвори"><I n="x"/></button></div></div>
    <label className="flex items-center gap-2 text-sm"><span className="text-slate-500">Шаблон:</span>
     <select value={cur} onChange={e=>applyTpl(k,e.target.value)} className="flex-1 min-w-0 px-2 py-2 rounded-lg bg-slate-100">{S.tpls.map(t=><option key={t.id} value={t.id}>{t.id===S.def?'★ ':''}{t.name}</option>)}</select></label>
    {!edit?<div className="space-y-2 my-3">{T.length===0&&<p className="text-sm text-slate-500">Няма задачи за този ден. Избери шаблон или натисни „Редактирай деня“.</p>}
     {T.map(t=>{const on=d.includes(t.id);return <button key={t.id} onClick={()=>toggle(k,t.id)} className={`w-full flex items-center gap-3 p-3 rounded-xl text-left ${on?'bg-emerald-50':'bg-slate-100'}`}>
      <span className={`w-6 h-6 rounded-md flex items-center justify-center border-2 ${on?'bg-emerald-600 border-emerald-600 text-white':'border-slate-400'}`}>{on&&<I n="check" s={16}/>}</span>
      <span className={`flex-1 ${on?'line-through text-slate-500':''}`}>{t.name}</span><span className="text-sm text-slate-500">{t.w}%</span></button>})}</div>
    :<div className="my-3"><div className="space-y-2">{T.map(t=><div key={t.id} className="bg-slate-100 rounded-xl p-2 flex items-center gap-2">
      <input value={t.name} onChange={e=>chg(t.id,{name:e.target.value})} className="flex-1 min-w-0 px-2 py-2 rounded-lg bg-white" aria-label="Име"/>
      <WInput value={t.w} onCommit={w=>chg(t.id,{w})} className="w-16 px-2 py-2 rounded-lg bg-white text-center"/><span className="text-sm">%</span>
      <button className="p-2 text-red-600" aria-label="Изтрий" onClick={()=>updDay(k,a=>a.filter(x=>x.id!==t.id))}><I n="trash"/></button></div>)}</div>
     <div className="bg-slate-100 rounded-xl p-2 flex items-center gap-2 mt-2">
      <input value={dn} onChange={e=>setDn(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addD()} placeholder="Нова задача за деня" className="flex-1 min-w-0 px-2 py-2 rounded-lg bg-white"/>
      <input type="number" onFocus={sel} value={dw} onChange={e=>setDw(e.target.value)} className="w-16 px-2 py-2 rounded-lg bg-white text-center" aria-label="Тежест"/><span className="text-sm">%</span>
      <button onClick={addD} className="p-2 rounded-lg bg-[#1F3A5F] text-white" aria-label="Добави"><I n="plus"/></button></div>
     <p className={`text-xs mt-2 ${tot===100?'text-emerald-700':'text-amber-700'}`}>Сума на тежестите: {tot}%{tot!==100&&' — процентът се нормализира.'}</p></div>}
    <div className="flex gap-2 mb-3 text-sm font-semibold">
     <button onClick={()=>setEdit(!edit)} className="flex-1 py-2 rounded-xl bg-slate-100">{edit?'Готово':'Редактирай деня'}</button>
     <button onClick={saveT} className="flex-1 py-2 rounded-xl bg-slate-100">Запази като шаблон</button></div>
    <textarea value={S.notes[k]||''} onChange={e=>note(k,e.target.value)} rows="3" placeholder="Бележка за деня – как мина?" className="w-full p-3 rounded-xl bg-slate-100 text-sm"/>
   </div></div>};

 const TABS=[['cal','Календар','cal'],['tpl','Шаблони','list'],['stats','Статистики','chart']];
 return <div className="w-full max-w-md mx-auto min-h-[100dvh] pb-28 px-3 pt-4">
  {tab==='cal'&&Calendar()}{tab==='tpl'&&Tpls()}{tab==='stats'&&Stats()}
  {tab==='cal'&&<button onClick={()=>open(today)} className="fixed right-4 bottom-24 w-14 h-14 rounded-full bg-[#1F3A5F] text-white shadow-xl flex items-center justify-center" style={{marginBottom:'env(safe-area-inset-bottom)'}} aria-label="Отметни днес"><I n="check" s={26}/></button>}
  <nav className="fixed bottom-0 inset-x-0 bg-white border-t border-slate-200" style={{paddingBottom:'env(safe-area-inset-bottom)'}}>
   <div className="max-w-md mx-auto grid grid-cols-3">{TABS.map(([id,l,ic])=><button key={id} onClick={()=>setTab(id)} className={`py-2.5 flex flex-col items-center text-xs font-semibold ${tab===id?'text-[#1F3A5F]':'text-slate-400'}`}><I n={ic}/>{l}</button>)}</div></nav>
  {sheet&&Sheet()}
 </div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
